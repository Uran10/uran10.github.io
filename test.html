<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Mappa Note</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView([45.314, 9.503], 13);

L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);

const points = JSON.parse(
    localStorage.getItem("map-notes") || "[]"
);

function savePoints() {
    localStorage.setItem(
        "map-notes",
        JSON.stringify(points)
    );
}

function addMarker(point) {

    const marker = L.marker([
        point.lat,
        point.lng
    ]).addTo(map);

    marker.bindPopup(`
        <b>${point.title}</b><br>
        ${point.note}
    `);
}

points.forEach(addMarker);

map.on("click", function(e) {

    const title = prompt("Titolo");

    if (!title) return;

    const note = prompt("Nota") || "";

    const point = {
        lat: e.latlng.lat,
        lng: e.latlng.lng,
        title: title,
        note: note
    };

    points.push(point);

    savePoints();

    addMarker(point);
});

</script>

</body>
</html>
