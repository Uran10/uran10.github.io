---
layout: blog
---	  
<p>{% include date_it.html date=page.date %}</p>
<div class="post-title">
<a href="{{ post.url }}">{{ page.title }}</a>
</div>
<div class="field-border post-content">
{{ page.content }}
</div>
<div class="status-field-border panel-status">
Commenti?
</div>
<!--Commenti-->
{% include comments.html %}
<!--Fine Commenti-->
<div class="post-navigation">
  {% if page.previous %}
    <a class="prev-post" href="{{ page.previous.url | relative_url }}">
      &laquo; Precedente: {{ page.previous.title }}
    </a>
  {% endif %}
 - 
  {% if page.next %}
    <a class="next-post" href="{{ page.next.url | relative_url }}">
      Prossimo: {{ page.next.title }} &raquo;
    </a>
  {% endif %}
</div>
