<!DOCTYPE html>
<html>
<head>
  <title>{{ page.title }}</title>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="https://unpkg.com/98.css" />
  <link rel="stylesheet" href="/assets/css/stile_base.css" />
  <link rel="stylesheet" href="/assets/css/card.css" />
</head>

<body>
<div class="winbar">
    <img src="/img/immaginebase.png" alt="Logo"><div style="font-size: 20px;">Roberto M.</div>
</div>

<div class="layout">

    <div class="left">
    <a class="icon" href="/about.html">
        <img src="/assets/images/WINHE002.PNG" alt="About me">
        <span>About me</span>
    </a>

    <a class="icon" href="/index.html">
        <img src="/assets/images/CLIPB001.PNG" alt="Blog">
        <span>Blog</span>
    </a>

    <a class="icon" href="/apps.html">
        <img src="/assets/images/PROGM012.PNG" alt="Apps">
        <span>Apps</span>
    </a>
	
	<a class="icon" href="https://glass.photo/uranio">
        <img src="/assets/images/glass_icon.png" alt="Glass">
        <span>Glass</span>
    </a>
    </div>

    <div class="right">
  <div class="window">
      <div class="title-bar">
		  <div class="title-bar-text">
			{{ page.title }}
		  </div>
		  <div class="title-bar-controls">
			<button aria-label="Any Text" class="help"></button>
			<button aria-label="Any Text" class="close"></button>
		  </div>
    </div>
	<div class="window-body">
<img class="responsive-image" src="/assets/images/blog_header.jpg" alt="War Games" />
<p>Lo pseudo-blog di uno pseudo-informatico.</p>
	  
<p>{% include date_it.html date=post.date %}</p>
<div style="margin-bottom: 4px;font-size: 20px;font-family: Verdana, Geneva, Arial, Helvetica, sans-serif;">
<a href="{{ post.url }}">{{ post.title }}</a>
</div>
<div class="field-border" style="padding: 8px; font-size: 16px;font-family: Verdana, Geneva, Arial, Helvetica, sans-serif;">
{{ post.content }}
</div>
<div class="status-field-border" style="padding: 8px">
Commenti?
</div>
<br />
	</div>
  </div>
    </div>

</div>
</body>
</html>
