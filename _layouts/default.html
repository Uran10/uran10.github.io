<!DOCTYPE html>
<html>
<head>
  <title>{{ page.title }}</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/98.css" />
  <link rel="stylesheet" href="{{ "/assets/css/stile_base.css" | relative_url }}" />
</head>

<body id="top">
<div class="winbar">
    <img src="/img/immaginebase.png" alt="Logo"><div class="site-name">Roberto M.</div>
</div>
<div class="layout">
    <div class="left">
    {% include icons_left.html %}
    </div>
  <div class="right">
	  <div class="window">
		  <div class="title-bar">
			  <div class="title-bar-text">
				{{ page.title }}
			  </div>
			  <div class="title-bar-controls">
				<button aria-label="Any Text" class="help"></button>
				<button aria-label="Any Text" class="close"></button>
			  </div>
		</div>
		<div class="window-body">
			{{ content }}
		</div>
		<div class="status-field-border panel-status">
			<div class="back-to-top"><a href="#top">Up &#9650;</a></div>
		</div>
	  </div>
  </div>
</div>
{% include tracking.html %}
</body>
</html>
