<p>{% include date_it.html date=post.date %}</p>
<div class="post-title">
<a href="{{ post.url }}">{{ post.title }}</a>
</div>
<div class="field-border post-content">
{{ post.content }}
</div>
{% assign comment_post_url = post.url | relative_url | escape %}
<div class="status-field-border panel-status post-comment-count">
  <a href="{{ comment_post_url }}" data-comments-post="{{ comment_post_url }}" hidden></a>
</div>
